name: CI

# This workflow runs on every push to ensure Gocker builds and tests pass
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Set up Docker
      # Docker is required for the setup target which uses docker export
      # to create the Alpine rootfs used as the OverlayFS lower layer
      uses: docker/setup-buildx-action@v3
    
    - name: Configure sudo for testing
      # Gocker requires root privileges to create Linux namespaces (UTS, PID, Mount)
      # and to manage cgroups. This step ensures sudo is available without password
      # for the current user, which is required for namespace operations
      run: |
        RUNNER_USER=$(whoami)
        echo "$RUNNER_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/$RUNNER_USER
        sudo visudo -cf /etc/sudoers.d/$RUNNER_USER
    
    - name: Run setup
      # Setup downloads and extracts Alpine rootfs using docker export.
      # The rootfs is the shared OverlayFS lower layer for each container.
      run: |
        sudo modprobe overlay
        make setup
    
    - name: Unprivileged user-namespace tests
      # Optional user-namespace path (not the rootful 4-ns default).
      run: make test-unprivileged

    - name: Run tests
      # Tests must run with sudo because:
      # 1. Linux namespaces (CLONE_NEWUTS, CLONE_NEWPID, CLONE_NEWNS) require root
      # 2. Cgroups v2 operations require root to create directories and write limits
      # 3. OverlayFS mount and pivot_root require root
      # Without sudo, the container isolation features cannot function
      run: sudo make test

    - name: Startup benchmark
      run: sudo make bench

    - name: Upload startup bench JSON
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: startup-bench
        path: docs/startup_bench.json
        if-no-files-found: ignore

